# Flatpak manifest for Abinova — repacks the self-contained Linux bundle
# produced by dist/linux-bundle.sh (the CI `linux` job). The bundle ships
# its own GTK4 + every dependency, so no source modules are needed; the
# manifest just installs the tree under /app/opt/abinova and exports the
# desktop file, icons, metainfo and mime info it already contains.
#
# Runtime choice: org.freedesktop.Platform is enough because every library
# is bundled. Switch to org.gnome.Platform if tighter portal/GTK-theming
# integration is wanted later.
app-id: io.github.janos_szenfner.Abinova
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: abinova
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # word processor: document access + printing via the CUPS socket
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/run/cups
modules:
  - name: abinova
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt /app/bin /app/share
      - cp -a bundle /app/opt/abinova
      - ln -s /app/opt/abinova/bin/abinova /app/bin/abinova
      - cp -a bundle/share/. /app/share/
      # Flatpak only exports icons named after the app-id — rename the
      # bundle's abinova.* icons and retarget the desktop file's Icon=.
      - find /app/share/icons/hicolor -name 'abinova.*' -exec sh -c 'for f; do mv "$f" "${f%abinova.*}io.github.janos_szenfner.Abinova.${f##*.}"; done' _ {} +
      - sed -i 's/^Icon=abinova$/Icon=io.github.janos_szenfner.Abinova/' /app/share/applications/io.github.janos_szenfner.Abinova.desktop
    sources:
      # prepared by CI: the release bundle extracted to ./bundle
      - type: dir
        path: bundle
        dest: bundle
