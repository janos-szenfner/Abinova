<!DOCTYPE html>

<title>HTML Coverage Fixture</title>
<style>

</style>
</head>
<body>
<h1>HTML Coverage Heading</h1>
<p>Paragraph with <b>bold</b>, <i>italic</i>, <u>underline</u>,
<s>strike</s>, <sup>sup</sup>, <sub>sub</sub> and <code>code</code>.</p>
<p class="note">Class-styled paragraph.</p>
<ul>
<li>Bullet one</li>
<li>Bullet two</li>
</ul>
<ol>
<li>Numbered one</li>
<li>Numbered two</li>
</ol>
<table class="data">
<tr><th>H1</th><th>H2</th></tr>
<tr><td>a1</td><td>b1</td></tr>
<tr><td colspan="2">merged a2:b2</td></tr>
</table>
<p><img src="red.png" alt="red" width="32" height="24"></p>
<blockquote><p>Quoted block.</p></blockquote>
<p>Entities: &amp; &lt; &gt; &eacute; &nbsp; end.</p>
</body>
</html>
