name: Release

# Build installers/bundles for all supported platforms on version tags.
# Every platform's packaging already lives in tools/build-*.sh +
# dist/*.sh — these jobs only drive them. A tag push (vX.Y.Z) also
# publishes a GitHub Release with every artifact attached.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag/release name to attach artifacts to (e.g. v4.0.0); empty = artifacts only'
        required: false
        default: ''

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag != '' && inputs.tag || '4.0.0') }}

jobs:
  # ------------------------------------------------------------------
  # Linux: self-contained bundle + .deb + .rpm
  # ubuntu-26.04 is the floor — its gtk4 4.22.x satisfies the
  # GTK_VERSION_REQ >= 4.20 configure check; 24.04 only ships 4.14.
  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Dependencies + build
        run: |
          sudo tools/build-linux.sh --distro ubuntu --jobs "$(nproc)"

      - name: Self-contained bundle
        run: |
          dist/linux-bundle.sh
          BUNDLE=$(ls -d dist/abinova-*-linux-x86_64 | head -1)
          echo "bundle=$BUNDLE" >> "$GITHUB_ENV"
          tar -cJf "abinova-${VERSION#v}-linux-x86_64.tar.xz" -C dist "$(basename "$BUNDLE")"

      - name: Debian package (.deb)
        # dist/make-deb.sh wires the desktop integration the bundle
        # carries: /usr/bin/abinova symlink, Exec=/usr/bin/abinova in
        # the .desktop file, hicolor icons + metainfo + MIME under
        # /usr/share, root-owned payload and postinst/postrm that
        # refresh the desktop/icon/MIME caches so the launcher shows
        # up right after install.
        run: |
          dist/make-deb.sh --bundle "${{ env.bundle }}" --out .

      - name: RPM package (.rpm)
        # rpm >= 4.20 creates the build dir itself during %mkbuilddir
        # and wipes whatever was pre-staged (rpm 6.0 on ubuntu-26.04
        # does this unconditionally) — staging BUILDROOT from the
        # workflow loses the whole payload.  Stage inside the spec's
        # %install instead: %{buildroot} exists by then on every rpm
        # version.  The /usr/bin symlink target is absolute — the old
        # ../opt/... relative link resolved to /usr/opt/abinova.
        run: |
          sudo apt-get install -y rpm
          BUNDLE="$(cd "${{ env.bundle }}" && pwd)"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          {
            printf 'Name:       abinova\n'
            printf 'Version:    %s\n' "${VERSION#v}"
            printf 'Release:    1%%{?dist}\n'
            printf 'Summary:    Abinova word processor (self-contained build)\n'
            printf 'License:    GPL-2.0-or-later\n'
            printf 'URL:        https://github.com/janos-szenfner/Abinova\n'
            printf 'BuildArch:  x86_64\nAutoReqProv: no\n'
            printf '%%description\n'
            printf 'GTK4 AbiWord-derived document editor. Installs to /opt/abinova\n'
            printf 'with a /usr/bin/abinova symlink; no external dependencies.\n\n'
            printf '%%install\n'
            printf 'mkdir -p %%{buildroot}/opt %%{buildroot}/usr/bin %%{buildroot}/usr/share\n'
            printf 'cp -a "%s" %%{buildroot}/opt/abinova\n' "$BUNDLE"
            printf 'ln -s /opt/abinova/bin/abinova %%{buildroot}/usr/bin/abinova\n'
            printf 'cp -a "%s/share/applications" "%s/share/icons" %%{buildroot}/usr/share/\n' "$BUNDLE" "$BUNDLE"
            printf 'cp -a "%s/share/metainfo" "%s/share/mime" %%{buildroot}/usr/share/\n' "$BUNDLE" "$BUNDLE"
            # launch through the /usr/bin symlink, not PATH lookup
            # (%%%%U -> %%U in the spec -> a literal %U reaching sed;
            # rpm would otherwise eat %U as a macro)
            printf 'sed -i "s|^Exec=.*|Exec=/usr/bin/abinova %%%%U|" %%{buildroot}/usr/share/applications/*.desktop\n\n'
            printf '%%post\n'
            printf 'update-desktop-database /usr/share/applications 2>/dev/null || :\n'
            printf 'gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || :\n'
            printf 'update-mime-database /usr/share/mime 2>/dev/null || :\n\n'
            printf '%%postun\n'
            printf 'update-desktop-database /usr/share/applications 2>/dev/null || :\n'
            printf 'gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || :\n'
            printf 'update-mime-database /usr/share/mime 2>/dev/null || :\n\n'
            printf '%%files\n'
            printf '/opt/abinova\n/usr/bin/abinova\n'
            printf '/usr/share/applications/*\n/usr/share/icons/*\n'
            printf '/usr/share/metainfo/*\n/usr/share/mime/*\n\n'
            printf '%%changelog\n'
            printf '* %s The Abinova Authors - %s-1\n- Release build.\n' "$(date '+%a %b %d %Y')" "${VERSION#v}"
          } > rpmbuild/SPECS/abinova.spec
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/abinova.spec
          cp rpmbuild/RPMS/x86_64/abinova-*.rpm .

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            abinova-*-linux-x86_64.tar.xz
            abinova_*.deb
            abinova-*.rpm

  # ------------------------------------------------------------------
  # Windows: MSYS2 build + NSIS installer
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Build + bundle
        run: |
          tools/build-windows-msys2.sh --bundle --jobs "$(nproc)"
          ls -d dist/abinova-*-windows-* | head -5

      - name: NSIS installer
        run: |
          try=1
          until pacman -S --noconfirm --disable-download-timeout mingw-w64-ucrt-x86_64-nsis zip; do
            [ $try -ge 5 ] && exit 1
            try=$((try+1)); sleep 20
          done
          BUNDLE=$(ls -d dist/abinova-*-windows-* | head -1)
          makensis -DVERSION="${VERSION#v}" -DARCH=x86_64 \
            -DSRCDIR="$(cygpath -w "$(cd "$BUNDLE" && pwd)")" \
            -DOUTFILE="$(cygpath -w "$(pwd)/abinova-${VERSION#v}-windows-x86_64-setup.exe")" \
            dist/abinova-setup.nsi
          cd "$BUNDLE/.." && zip -qr "$OLDPWD/abinova-${VERSION#v}-windows-x86_64.zip" "$(basename "$BUNDLE")"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            abinova-*-windows-x86_64-setup.exe
            abinova-*-windows-x86_64.zip

  # ------------------------------------------------------------------
  # macOS: .app + .dmg (ad-hoc signed; real identity via secrets)
  # ------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build + .app bundle
        env:
          ABINOVA_CODESIGN_IDENTITY: ${{ secrets.ABINOVA_CODESIGN_IDENTITY }}
          ABINOVA_NOTARIZE_PROFILE: ${{ secrets.ABINOVA_NOTARIZE_PROFILE }}
        run: |
          ARGS="--bundle --jobs $(sysctl -n hw.ncpu)"
          [ -n "$ABINOVA_CODESIGN_IDENTITY" ] && ARGS="$ARGS --sign-identity '$ABINOVA_CODESIGN_IDENTITY'"
          [ -n "$ABINOVA_NOTARIZE_PROFILE" ] && ARGS="$ARGS --notarize-profile '$ABINOVA_NOTARIZE_PROFILE'"
          eval tools/build-macos.sh $ARGS
          ls -d Abinova.app dist/Abinova.app 2>/dev/null | head -3

      - name: DMG
        run: |
          APP=$(ls -d Abinova.app dist/Abinova.app 2>/dev/null | head -1)
          ARCH=$(uname -m)
          # stage app + /Applications symlink so drag-install works
          STAGE=$(mktemp -d)
          cp -a "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Abinova -srcfolder "$STAGE" -ov -format UDZO \
            "abinova-${VERSION#v}-macos-${ARCH}.dmg"
          tar -cJf "abinova-${VERSION#v}-macos-${ARCH}-app.tar.xz" -C "$(dirname "$APP")" Abinova.app

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            abinova-*-macos-*.dmg
            abinova-*-macos-*-app.tar.xz

  # ------------------------------------------------------------------
  # FreeBSD: build inside a VM (no GitHub-hosted BSD runner)
  # Produces a staged-install tarball — pkg(8) packaging is a TODO.
  # ------------------------------------------------------------------
  freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: pkg install -y rsync
          run: |
            set -e
            tools/build-freebsd.sh --jobs "$(sysctl -n hw.ncpu)"
            mkdir -p out/stage
            gmake -C build-freebsd install DESTDIR="$PWD/out/stage"
            PKGVER="${{ env.VERSION }}"; PKGVER="${PKGVER#v}"
            tar -czf "out/abinova-${PKGVER}-freebsd-amd64.tar.gz" -C out/stage .

      - uses: actions/upload-artifact@v7
        with:
          name: freebsd
          path: out/abinova-*-freebsd-amd64.tar.gz

  # ------------------------------------------------------------------
  # Flatpak: repack the linux job's self-contained bundle via
  # flatpak-builder (manifest at repo root). Produces a .flatpak single
  # file users can `flatpak install`.
  # ------------------------------------------------------------------
  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: artifacts

      - name: Extract bundle
        run: |
          mkdir -p bundle
          tar -xJf artifacts/abinova-*-linux-x86_64.tar.xz -C bundle --strip-components=1
          test -x bundle/bin/abinova

      - name: Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Build flatpak
        run: |
          flatpak-builder --user --repo=repo --force-clean build-dir io.github.janos_szenfner.Abinova.yaml
          flatpak build-bundle repo "abinova-${VERSION#v}-x86_64.flatpak" io.github.janos_szenfner.Abinova

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: abinova-*-x86_64.flatpak

  # ------------------------------------------------------------------
  # Publish: attach every artifact to the tag's GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [linux, windows, macos, freebsd, flatpak]
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' || inputs.tag != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          REPO="${{ github.repository }}"
          # release notes = this version's CHANGELOG.md section
          VER="${TAG#v}"
          awk -v v="$VER" \
            '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ && f {exit} f' \
            CHANGELOG.md | sed '1{/^$/d}' > release-notes.md
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [ -s release-notes.md ]; then
              gh release create "$TAG" --repo "$REPO" \
                --title "Abinova ${TAG#v}" \
                --notes-file release-notes.md
            else
              gh release create "$TAG" --repo "$REPO" \
                --title "Abinova ${TAG#v}" \
                --notes "Automated release build of Abinova ${TAG#v}."
            fi
          fi
          gh release upload "$TAG" release-files/* --repo "$REPO" --clobber
