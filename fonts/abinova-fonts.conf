<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font substitution rules for AbiWord's bundled font collection.

  Maps common document font names (mostly Microsoft/Office families)
  onto the metric-compatible fonts bundled with AbiWord, so documents
  keep their layout even when the original fonts are not installed.
-->
<fontconfig>

	<!-- Calibri -> Carlito -->
	<match target="pattern">
		<test name="family"><string>Calibri</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Carlito</string>
		</edit>
	</match>

	<!-- Cambria -> Caladea -->
	<match target="pattern">
		<test name="family"><string>Cambria</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Caladea</string>
		</edit>
	</match>

	<!-- Aptos -> Intos -->
	<match target="pattern">
		<test name="family"><string>Aptos</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Aptos Display</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos Display</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Aptos Narrow</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos Narrow</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Aptos Serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos Serif</string>
		</edit>
	</match>

	<!-- Times New Roman -> Liberation Serif -->
	<match target="pattern">
		<test name="family"><string>Times New Roman</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Serif</string>
		</edit>
	</match>

	<!-- Arial -> Liberation Sans -->
	<match target="pattern">
		<test name="family"><string>Arial</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Sans</string>
		</edit>
	</match>

	<!-- Arial Narrow -> Liberation Sans Narrow -->
	<match target="pattern">
		<test name="family"><string>Arial Narrow</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Sans Narrow</string>
		</edit>
	</match>

	<!-- Courier New -> Liberation Mono -->
	<match target="pattern">
		<test name="family"><string>Courier New</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Mono</string>
		</edit>
	</match>

	<!-- Calibri Light -> Carlito (metric-compatible; the requested
	     weight is kept so a real Carlito Light would be used if
	     installed, otherwise it degrades to Carlito regular) -->
	<match target="pattern">
		<test name="family"><string>Calibri Light</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Carlito</string>
		</edit>
		<edit name="weight" mode="prepend" binding="strong">
			<const>light</const>
		</edit>
	</match>

	<!-- Segoe UI family -> Intos (metric-compatible Aptos clone,
	     same humanist-sans proportions) -->
	<match target="pattern">
		<test name="family"><string>Segoe UI</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Segoe UI Light</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos</string>
		</edit>
		<edit name="weight" mode="prepend" binding="strong">
			<const>light</const>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Segoe UI Semibold</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Intos</string>
		</edit>
		<edit name="weight" mode="prepend" binding="strong">
			<const>demibold</const>
		</edit>
	</match>

	<!-- Georgia -> Gelasio (metric-compatible) then Gentium Book -->
	<match target="pattern">
		<test name="family"><string>Georgia</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Gentium Book</string>
		</edit>
		<edit name="family" mode="prepend" binding="strong">
			<string>Gelasio</string>
		</edit>
	</match>

	<!-- Tahoma -> DejaVu Sans (similarly proportioned sans) -->
	<match target="pattern">
		<test name="family"><string>Tahoma</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>DejaVu Sans</string>
		</edit>
	</match>

	<!-- Arial Black -> Liberation Sans at black weight (matches Bold) -->
	<match target="pattern">
		<test name="family"><string>Arial Black</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Sans</string>
		</edit>
		<edit name="weight" mode="prepend" binding="strong">
			<const>black</const>
		</edit>
	</match>

	<!-- Impact -> DejaVu Sans Condensed Bold (condensed heavy sans) -->
	<match target="pattern">
		<test name="family"><string>Impact</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>DejaVu Sans Condensed</string>
		</edit>
		<edit name="weight" mode="prepend" binding="strong">
			<const>bold</const>
		</edit>
	</match>

	<!-- Consolas -> Source Code Pro (bundled humanist mono) -->
	<match target="pattern">
		<test name="family"><string>Consolas</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Source Code Pro</string>
		</edit>
	</match>

	<!-- Candara / Corbel -> Source Sans 3 (humanist sans) -->
	<match target="pattern">
		<test name="family"><string>Candara</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Source Sans 3</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Corbel</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Source Sans 3</string>
		</edit>
	</match>

	<!-- Constantia -> Source Serif 4 (transitional serif) -->
	<match target="pattern">
		<test name="family"><string>Constantia</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Source Serif 4</string>
		</edit>
	</match>

	<!-- Palatino Linotype / Book Antiqua -> Linux Libertine O
	     (Palatine-style serif, bundled) -->
	<match target="pattern">
		<test name="family"><string>Palatino Linotype</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Linux Libertine O</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Book Antiqua</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Linux Libertine O</string>
		</edit>
	</match>

	<!-- Franklin Gothic -> Liberation Sans -->
	<match target="pattern">
		<test name="family"><string>Franklin Gothic Medium</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Sans</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Franklin Gothic</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Sans</string>
		</edit>
	</match>

	<!-- Comic Sans MS -> Comic Relief (system metric-compatible) -->
	<match target="pattern">
		<test name="family"><string>Comic Sans MS</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Comic Relief</string>
		</edit>
	</match>

	<!-- Verdana / Trebuchet MS -> DejaVu Sans (similarly wide sans) -->
	<match target="pattern">
		<test name="family"><string>Verdana</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>DejaVu Sans</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>Trebuchet MS</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>DejaVu Sans</string>
		</edit>
	</match>

	<!-- Symbol -> OpenSymbol -->
	<match target="pattern">
		<test name="family"><string>Symbol</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>OpenSymbol</string>
		</edit>
	</match>

	<!-- Generic fallbacks -->
	<match target="pattern">
		<test name="family"><string>serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Serif</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>sans-serif</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Carlito</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>sans</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Carlito</string>
		</edit>
	</match>
	<match target="pattern">
		<test name="family"><string>monospace</string></test>
		<edit name="family" mode="prepend" binding="strong">
			<string>Liberation Mono</string>
		</edit>
	</match>

</fontconfig>
